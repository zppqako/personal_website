<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navigation -->
<nav id="navbar">
  <a href="#" class="logo">Sun</a>
  <div class="nav-right">
    <ul class="nav-links">
      <li><a href="#gallery" class="active" data-zh="作品集">Gallery</a></li>
      <li><a href="#contact" data-zh="联系">Contact</a></li>
    </ul>
    <button class="lang-toggle" id="langToggle">中文</button>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- Mobile Menu -->
<div class="mobile-menu" id="mobileMenu">
  <a href="#gallery" data-zh="作品集">Gallery</a>
  <a href="#contact" data-zh="联系">Contact</a>
</div>

<!-- Hero -->
<section class="hero">
  <h1 class="hero-title" data-zh-html="光影<br><em>瞬间</em>">Moments<br><em>in Light</em></h1>
  <p class="hero-subtitle" data-zh="摄影作品集">Photography Portfolio</p>
  <div class="scroll-indicator">
    <span data-zh="向下滑动">Scroll</span>
    <div class="scroll-line"></div>
  </div>
</section>

<!-- Gallery Section -->
<section id="gallery">
  <div class="section-header reveal">
    <p class="section-label" data-zh="精选作品">Selected Work</p>
    <h2 class="section-title" data-zh="作品集">Gallery</h2>
    <div class="section-divider"></div>
  </div>

  <div class="gallery" id="galleryGrid"></div>
</section>

<!-- Contact Section -->
<section id="contact">
  <div class="section-header reveal">
    <p class="section-label" data-zh="联系方式">Get in Touch</p>
    <h2 class="section-title" data-zh="联系">Contact</h2>
    <div class="section-divider"></div>
  </div>

  <div class="contact reveal">
    <a href="mailto:billsun37@gmail.com">billsun37@gmail.com</a>
    <div class="contact-socials">
      <a href="https://www.instagram.com/bi1l_sun/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.linkedin.com/in/bill-sun9/" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>
</section>

<!-- Footer -->
<footer>
  <p data-zh="&copy; 2026 Sun. 保留所有权利。">&copy; 2026 Sun. All Rights Reserved.</p>
</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" aria-label="Close"></button>
  <button class="lightbox-nav lightbox-prev" aria-label="Previous">&#8592;</button>
  <button class="lightbox-nav lightbox-next" aria-label="Next">&#8594;</button>
  <img src="" alt="" id="lightboxImg">
</div>

<script src="js/main.js"></script>

</body>
</html>
