    <svg viewBox="0 0 44 12" aria-hidden="true"><path d="M44 6H1M6.5 0.5L1 6l5.5 5.5"/></svg>
  </button>
  <button class="lightbox-nav lightbox-next" aria-label="Next">
    <svg viewBox="0 0 44 12" aria-hidden="true"><path d="M0 6h43M37.5 0.5L43 6l-5.5 5.5"/></svg>
  </button>
  <figure class="lightbox-figure">

    <figcaption>
      <p class="lightbox-title" id="lightboxTitle"></p>
      <p class="lightbox-caption" id="lightboxCaption"></p>
    </figcaption>
  </figure>
</div>
